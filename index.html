<style>
/* Layout: one phone-width column — "now" ticket, sticker map, then the 12-stop itinerary. */
:root{
  --sea:#BFE0EC; --sea-wave:#9ACBDD; --land:#FFE28A; --land-ireland:#F1E7C6;
  --ink:#1E2A44; --ink-soft:#56607A; --paper:#FFFDF6; --bg:#EAF4F7;
  --pin:#F2545B; --pin-done:#2F7D6D; --route:#1E2A44; --chip:#FFF1C2; --line:#D3DEE3;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#16324A; --sea-wave:#21445F; --land:#C9A94E; --land-ireland:#3A4152;
  --ink:#F4EEDC; --ink-soft:#AEB6C8; --paper:#1D2638; --bg:#111A28;
  --pin:#FF7A7F; --pin-done:#6CC7B2; --route:#F4EEDC; --chip:#3A3420; --line:#2E3A50; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#16324A; --sea-wave:#21445F; --land:#C9A94E; --land-ireland:#3A4152;
  --ink:#F4EEDC; --ink-soft:#AEB6C8; --paper:#1D2638; --bg:#111A28;
  --pin:#FF7A7F; --pin-done:#6CC7B2; --route:#F4EEDC; --chip:#3A3420; --line:#2E3A50; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--ink-soft);max-width:34em}
.ticket{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px}
.ticket-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--pin);color:#fff}
.tag.wait{background:var(--ink);color:var(--paper)}
.week{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.now-city{font-family:var(--display);font-size:34px;line-height:1.1}
.now-name{font-size:18px;font-weight:700}
.now-dates{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.xhs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--chip);border-radius:12px;padding:10px 12px}
.xhs-label{font-size:12px;color:var(--ink-soft)}
.xhs-id{font-weight:700;user-select:all;word-break:break-all}
.btn{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer;text-decoration:none}
.btn:focus-visible,.pin:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.next{font-size:13px;color:var(--ink-soft);border-top:2px dashed var(--line);padding-top:10px}
.mapbox{background:var(--sea);border:2.5px solid var(--ink);border-radius:22px;overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.ireland{fill:var(--land-ireland);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;opacity:.8}
.wave{fill:none;stroke:var(--sea-wave);stroke-width:4;stroke-linecap:round}
.seg{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12;opacity:.55}
.seg.done{stroke-dasharray:none;opacity:1;stroke-width:5}
.seg.next{stroke:var(--pin);stroke-width:5;stroke-dasharray:4 14;opacity:1;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.nextq circle{fill:var(--paper);stroke:var(--pin);stroke-width:4;stroke-dasharray:6 6}
.nextq text{font-family:var(--display);font-size:34px;fill:var(--pin);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){.seg.next{animation:none}}
.pin{cursor:pointer}
.pin circle.dot{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.pin.done circle.dot{fill:var(--pin-done)}
.pin.now circle.dot{fill:var(--pin)}
.pin text.lbl{font-family:var(--display);font-size:32px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:7px;stroke-linejoin:round}
.pin.sel text.lbl{text-decoration:underline}
.halo{fill:var(--pin);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.6);opacity:0}}
.cam{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.halo,.cam{animation:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.citycard{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.citycard b{font-family:var(--display);font-weight:400;font-size:20px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:8px 0 0}
ol.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.stop.now{border-color:var(--pin);box-shadow:3px 3px 0 var(--pin)}
.stop.hl{border-color:var(--ink)}
.wk{font-family:var(--display);font-size:22px;text-align:center;line-height:1}
.wk small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-soft);margin-top:4px}
.who{min-width:0}
.who .n{font-weight:700}
.who .m{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.who .x{font-size:12px;color:var(--ink-soft);word-break:break-all}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1.5px solid var(--ink)}
.st.done{background:var(--pin-done);color:#fff;border-color:var(--pin-done)}
.st.now{background:var(--pin);color:#fff;border-color:var(--pin)}
.st.soon{background:transparent;color:var(--ink-soft);border-color:var(--line)}
footer{font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;text-align:center;padding-top:8px}
footer .ht{font-family:var(--display);font-size:20px;color:var(--ink)}
.host{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.host img{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--ink);object-fit:cover}
.host .hn{font-family:var(--display);font-size:20px;color:var(--ink);line-height:1.2}
.host .hr{font-size:12px;color:var(--ink-soft)}
.xhs img{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);object-fit:cover}
</style>
</head>

const curStop = cur>=0 ? shown[cur] : preview;
if(curStop && typeof curStop.nextDir==="number"){
  const [x1,y1]=CITIES[curStop.city], r=curStop.nextDir*Math.PI/180, L=170;
  const ux=Math.sin(r), uy=-Math.cos(r);
  const x2=x1+ux*L, y2=y1+uy*L, bend=28;
  const cx=(x1+x2)/2 - uy*bend, cy=(y1+y2)/2 + ux*bend;
  el("path",{class:"seg next",d:`M${x1+ux*22},${y1+uy*22} Q${cx},${cy} ${x2},${y2}`},segs);
  const q=el("g",{class:"nextq","aria-label":"下一站，保密"},segs);
  el("circle",{cx:x2+ux*24,cy:y2+uy*24,r:24},q);
  el("text",{x:x2+ux*24,y:y2+uy*24+2},q).textContent="?";
}

// pins: only cities the camera has been to, plus where it is now
const pins=document.getElementById("pins");
const nowCity = cur>=0 ? shown[cur].city : LAUNCH.city;
const cities=[...new Set([...shown.map(s=>s.city), nowCity])];
const pinEls={};
cities.forEach(c=>{
  const st = c===nowCity ? "now" : "done";
  const [x,y]=CITIES[c];
  const g=el("g",{class:`pin ${st}`,tabindex:"0",role:"button","aria-label":ZH[c]},pins);
  if(st==="now") el("circle",{class:"halo",cx:x,cy:y,r:34},g);
  el("circle",{class:"dot",cx:x,cy:y,r:st==="now"?16:12},g);
  const [lx,ly,anc]=LBL[c];
  el("text",{class:"lbl",x:x+lx,y:y+ly,"text-anchor":anc},g).textContent=ZH[c];
  if(st==="now"){
    const cam=el("g",{class:"cam"},g);
    el("rect",{x:x-26,y:y-78,width:52,height:38,rx:8,fill:"var(--ink)"},cam);
    el("rect",{x:x-18,y:y-86,width:14,height:8,rx:2,fill:"var(--ink)"},cam);
    el("circle",{cx:x+4,cy:y-59,r:11,fill:"var(--paper)"},cam);
    el("circle",{cx:x+4,cy:y-59,r:5,fill:"var(--ink)"},cam);
    el("path",{d:`M${x-8},${y-40} L${x},${y-26} L${x+8},${y-40}Z`,fill:"var(--ink)"},cam);
  }
  pinEls[c]=g;
  const pick=()=>selectCity(c);
  g.addEventListener("click",pick);
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
});

function copyBtn(text, target){
  const b=document.createElement("button"); b.className="btn"; b.type="button"; b.textContent="复制";
  b.addEventListener("click",()=>{
    const sel=()=>{ const r=document.createRange(); r.selectNodeContents(target); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="已选中，长按复制"; };
    try{ navigator.clipboard.writeText(text).then(()=>{b.textContent="已复制";setTimeout(()=>b.textContent="复制",1500);},sel); }catch(e){ sel(); }
  });
  return b;
}
function xhsRow(s){
  const row=document.createElement("div"); row.className="xhs";
  if(s&&s.avatar&&AVATARS[s.avatar]){ const im=document.createElement("img"); im.src=AVATARS[s.avatar]; im.alt=`${s.xhs}的头像`; row.append(im); }
  const l=document.createElement("span"); l.className="xhs-label"; l.textContent="小红书";
  const v=document.createElement("span"); v.className="xhs-id"; v.textContent=s&&s.xhs ? s.xhs : "即将公布";
  row.append(l,v);
  if(s&&s.xhs) row.append(copyBtn(s.xhs, v));
  if(s&&s.url){ const a=document.createElement("a"); a.className="btn"; a.href=s.url; a.target="_blank"; a.rel="noopener"; a.textContent="去主页"; row.append(a); }
  return row;
}

function selectCity(c){
  Object.values(pinEls).forEach(p=>p.classList.remove("sel"));
  pinEls[c].classList.add("sel");
  const card=document.getElementById("citycard");
  card.replaceChildren();
  const b=document.createElement("b"); b.textContent=ZH[c]; card.append(b);
  const here = shown.map((s,i)=>({s,i})).filter(o=>o.s.city===c);
  if(!here.length){ const d=document.createElement("div"); d.textContent=`${md(LAUNCH.date)} 从这里出发${preview?" · 第一棒":""}`; card.append(d); if(preview&&preview.city===c) card.append(xhsRow(preview)); return; }
  here.forEach(({s,i})=>{
    const d=document.createElement("div"); d.textContent=`第 ${i+1} 周${i===cur?" · 正在拍":""}`;
    card.append(d, xhsRow(s));
  });
}

const now=document.getElementById("now");
(function render(){
  const top=document.createElement("div"); top.className="ticket-top";
  const tag=document.createElement("span"); tag.className="tag";
  const wk=document.createElement("span"); wk.className="week";
  top.append(tag,wk);
  const city=document.createElement("div"); city.className="now-city";
  if(cur<0){
    tag.textContent="即将出发"; tag.classList.add("wait");
    const n=daysBetween(today,LAUNCH.date);
    wk.textContent = n>0 ? `还有 ${n} 天` : "今天出发";
    city.textContent=ZH[LAUNCH.city];
    const d=document.createElement("div"); d.className="now-dates"; d.textContent=`${md(LAUNCH.date)} 从这里出发${preview?"，第一棒是":""}`;
    now.append(top,city,d);
    if(preview) now.append(xhsRow(preview));
  } else {
    const s=shown[cur];
    tag.textContent="相机现在在"; wk.textContent=`第 ${cur+1} 周`;
    city.textContent=ZH[s.city];
    const d=document.createElement("div"); d.className="now-dates"; d.textContent="这周拿着相机的是";
    now.append(top,city,d,xhsRow(s));
  }
})();

(function(){const b=document.getElementById("hostcopy"),t=document.getElementById("hostname");b.addEventListener("click",()=>{const sel=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="已选中，长按复制";};try{navigator.clipboard.writeText("奶盖").then(()=>{b.textContent="已复制";setTimeout(()=>b.textContent="复制昵称",1500);},sel);}catch(e){sel();}});})();
</script>
