<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>报名后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
</head>
<body data-page="admin">
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">只有发起人能用</div>
    <h1>报名后台</h1>
  </header>

  <form class="card form" id="login">
    <label class="field"><span>邮箱</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
    <p class="err" id="lerr" role="alert"></p>
    <div class="row">
      <button class="btn hot big" type="submit">登录</button>
      <button class="btn big" type="button" id="reg">第一次用：注册</button>
    </div>
    <p class="muted" style="margin:0">注册后去邮箱点确认链接（跳转的页面打不开没关系），再回来登录。登录后告诉 Claude，把你的账号加进管理员名单。</p>
  </form>

  <section id="panel" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <div class="seg" role="tablist">
        <button class="seg-b" role="tab" data-tab="signups" aria-selected="true">报名</button>
        <button class="seg-b" role="tab" data-tab="subs" aria-selected="false">投稿审核</button>
        <button class="seg-b" role="tab" data-tab="community" aria-selected="false">社区</button>
        <button class="seg-b" role="tab" data-tab="links" aria-selected="false">持有人链接</button>
      </div>
      <span class="row"><button class="btn" id="refresh">刷新</button><button class="btn" id="out">退出</button></span>
    </div>
    <div data-pane="signups">
      <p class="muted" id="count" style="margin:0 0 12px"></p>
      <div id="list" class="stack"></div>
    </div>
    <div data-pane="subs" hidden>
      <p class="muted" style="margin:0 0 12px">通过的作品会显示在对应站点页上；「不展示」的只有你能看到。</p>
      <div id="subs" class="stack"></div>
    </div>
    <div data-pane="community" hidden>
      <p class="muted" style="margin:0 0 12px">帖子和评论发出就会显示。看到不合适的，改成「隐藏」就只有你能看到；乱发的人点「拉黑」，他的评论全部隐藏，以后也不能再评论。</p>
      <div id="posts" class="stack"></div>
    </div>
    <div data-pane="links" hidden>
      <form class="card form" id="newlink" style="margin-bottom:16px">
        <h2 style="margin:0">给持有人生成专属链接</h2>
        <div class="split" style="grid-template-columns:110px 1fr">
          <input name="stop" type="number" min="0" max="200" required placeholder="第几站" aria-label="第几站（0 是发起人自己）">
          <input name="label" maxlength="40" placeholder="持有人昵称（会显示在投稿页上）" aria-label="持有人昵称">
        </div>
        <button class="btn hot" type="submit">生成链接</button>
        <p class="muted" style="margin:0">把链接私信给这一站的持有人，用它发社区帖子、投作品，交接后也能一直用。不要发在群里，拿到链接的人都能用；有人不该再发了就点「停用」。站号填 0 生成的是你自己的发帖链接，帖子会显示成发起人。</p>
      </form>
      <div id="links" class="stack"></div>
    </div>
  </section>
</main>
<script src="assets/common.js"></script>
<script src="assets/db.js"></script>
<script>
const login=document.getElementById("login"), lerr=document.getElementById("lerr");
const panel=document.getElementById("panel"), list=document.getElementById("list");
const STATUSES=["新报名","已联系","已确认","这期不排"];
const travel=v=>v===true?"愿意跨城":v===false?"只在本城":"看情况";
function item(r){
  const c=document.createElement("article"); c.className="card admin-item";
  const top=document.createElement("div"); top.className="top";
  const name=document.createElement("b"); name.textContent=`${r.nickname} · ${r.city}`;
  const sel=document.createElement("select"); sel.setAttribute("aria-label","状态");
  STATUSES.forEach(s=>{const o=document.createElement("option"); o.textContent=s; o.selected=s===r.status; sel.append(o);});
  sel.addEventListener("change",async()=>{ sel.disabled=true; try{ await GP.db.setStatus(r.id,sel.value); }catch(e){ alert("没改成功："+e.message); sel.value=r.status; } sel.disabled=false; });
  top.append(name,sel); c.append(top);
  const kv=(k,v)=>{ if(!v) return; const d=document.createElement("div"); d.className="kv"; const b=document.createElement("b"); b.textContent=k+"："; d.append(b,document.createTextNode(v)); c.append(d); };
  kv("报名", r.season); kv(r.contact_type, r.contact); kv("时间", r.weeks); kv("交接", travel(r.can_travel)); kv("留言", r.note);
  kv("提交于", new Date(r.created_at).toLocaleString("zh-CN",{timeZone:"Europe/London"}));
  return c;
}
async function load(){
  list.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"加载中…"}));
  try{
    const rows=await GP.db.listSignups();
    document.getElementById("count").textContent=`共 ${rows.length} 人报名`;
    list.replaceChildren(...(rows.length?rows.map(item):[Object.assign(document.createElement("div"),{className:"empty",textContent:"还没有人报名，或者你的账号还不在管理员名单里。"})]));
  }catch(e){
    if(e.status===401){ GP.db.signOut(); show(); lerr.textContent="登录过期了，再登录一次。"; return; }
    list.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"读取失败："+e.message}));
  }
}
// ---- 投稿审核 ----
const SUB_ST=["待审核","已通过","不展示"];
function subItem(r){
  const c=document.createElement("article"); c.className="card admin-item";
  const top=document.createElement("div"); top.className="top";
  const name=document.createElement("b"); name.textContent=`第 ${r.stop_no} 站 · ${r.kind}${r.platform?" · "+r.platform:""}`;
  const sel=document.createElement("select"); sel.setAttribute("aria-label","审核状态");
  SUB_ST.forEach(s=>{const o=document.createElement("option"); o.textContent=s; o.selected=s===r.status; sel.append(o);});
  sel.addEventListener("change",async()=>{ sel.disabled=true; try{ await GP.db.setSubmissionStatus(r.id,sel.value); r.status=sel.value; }catch(e){ alert("没改成功："+e.message); sel.value=r.status; } sel.disabled=false; });
  top.append(name,sel); c.append(top);
  if(r.url){ const a=document.createElement("a"); a.href=r.url; a.target="_blank"; a.rel="noopener noreferrer"; a.className="kv"; a.textContent=r.title?`${r.title} ↗`:r.url; c.append(a); }
  if(r.note){ const p=document.createElement("div"); p.className="kv"; p.style.whiteSpace="pre-wrap"; p.textContent=r.note; c.append(p); }
  const t=document.createElement("div"); t.className="kv"; t.textContent=new Date(r.created_at).toLocaleString("zh-CN",{timeZone:"Europe/London"}); c.append(t);
  return c;
}
async function loadSubs(){
  const box=document.getElementById("subs");
  box.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"加载中…"}));
  try{ const rows=await GP.db.listSubmissions(); rows.sort((a,b)=>(a.status==="待审核"?0:1)-(b.status==="待审核"?0:1));
    box.replaceChildren(...(rows.length?rows.map(subItem):[Object.assign(document.createElement("div"),{className:"empty",textContent:"还没有投稿。"})])); }
  catch(e){ box.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"读取失败："+e.message})); }
}
// ---- 投稿链接 ----
const linkUrl=t=>new URL(`post.html?k=${t}`, location.href).href;
function linkItem(l){
  const c=document.createElement("article"); c.className="card admin-item";
  const top=document.createElement("div"); top.className="top";
  const name=document.createElement("b"); name.textContent=`${l.stop_no===0?"发起人":`第 ${l.stop_no} 站`}${l.label?" · "+l.label:""}${l.active?"":"（已停用）"}`;
  const tog=document.createElement("button"); tog.className="btn"; tog.textContent=l.active?"停用":"恢复";
  tog.addEventListener("click",async()=>{ try{ await GP.db.setLinkActive(l.token,!l.active); l.active=!l.active; c.replaceWith(linkItem(l)); }catch(e){ alert("没改成功："+e.message); } });
  top.append(name,tog); c.append(top);
  const v=document.createElement("div"); v.className="kv"; v.style.wordBreak="break-all"; v.textContent=linkUrl(l.token);
  const row=document.createElement("div"); row.className="row"; row.append(GP.copyBtn(linkUrl(l.token),v));
  c.append(v,row); return c;
}
async function loadLinks(){
  const box=document.getElementById("links");
  try{ const rows=await GP.db.listLinks(); box.replaceChildren(...(rows.length?rows.map(linkItem):[Object.assign(document.createElement("div"),{className:"empty",textContent:"还没有生成过链接。"})])); }
  catch(e){ box.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"读取失败："+e.message})); }
}
document.getElementById("newlink").addEventListener("submit",async e=>{
  e.preventDefault(); const d=new FormData(e.target);
  const n=parseInt(d.get("stop"),10); if(!(n>=0)) return;
  try{ await GP.db.createLink(n, GP.season, (d.get("label")||"").trim()||null); e.target.reset(); loadLinks(); }
  catch(x){ alert("没生成成功："+x.message); }
});
// ---- 社区 ----
const VIS=["显示","隐藏"];
function visSel(cur,save){
  const sel=document.createElement("select"); sel.setAttribute("aria-label","显示状态");
  VIS.forEach(s=>{const o=document.createElement("option"); o.textContent=s; o.selected=s===cur; sel.append(o);});
  sel.addEventListener("change",async()=>{ sel.disabled=true; try{ await save(sel.value); cur=sel.value; }catch(e){ alert("没改成功："+e.message); sel.value=cur; } sel.disabled=false; });
  return sel;
}
async function loadPosts(){
  const box=document.getElementById("posts");
  box.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"加载中…"}));
  try{
    const [posts,cmts]=await Promise.all([GP.db.listPosts(),GP.db.listComments()]);
    if(!posts.length){ box.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"还没有帖子。"})); return; }
    box.replaceChildren(...posts.map(p=>{
      const s=GP.stops[p.stop_no-1]||{};
      const c=document.createElement("article"); c.className="card admin-item";
      const top=document.createElement("div"); top.className="top";
      const name=document.createElement("b"); name.textContent=`${p.stop_no===0?"发起人":`第 ${p.stop_no} 站 · ${s.xhs||"持有人"}`} · ${new Date(p.created_at).toLocaleString("zh-CN",{timeZone:"Europe/London"})}`;
      top.append(name,visSel(p.status,v=>GP.db.setPostStatus(p.id,v))); c.append(top);
      const b=document.createElement("div"); b.className="kv"; b.style.whiteSpace="pre-wrap"; b.textContent=p.body; c.append(b);
      if(p.images.length){ const d=document.createElement("div"); d.className="kv"; d.textContent=`${p.images.length} 张照片`; c.append(d); }
      cmts.filter(x=>x.post_id===p.id).reverse().forEach(x=>{
        const r=document.createElement("div"); r.className="row"; r.style.cssText="justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px";
        const t=document.createElement("div"); t.className="kv"; t.style.flex="1"; t.textContent=`${x.nickname}：${x.body}`;
        const ban=document.createElement("button"); ban.className="btn"; ban.type="button"; ban.textContent="拉黑";
        ban.addEventListener("click",async()=>{ if(!confirm(`拉黑「${x.nickname}」？他的评论会全部隐藏，以后也不能再评论。`)) return; try{ await GP.db.banAuthor(x.id); loadPosts(); }catch(e){ alert("没拉黑成功："+e.message); } });
        r.append(t,visSel(x.status,v=>GP.db.setCommentStatus(x.id,v)),ban); c.append(r);
      });
      return c;
    }));
  }catch(e){ box.replaceChildren(Object.assign(document.createElement("div"),{className:"empty",textContent:"读取失败："+e.message})); }
}
// ---- 标签切换 ----
let tab="signups";
const loaders={signups:()=>load(), subs:loadSubs, community:loadPosts, links:loadLinks};
document.querySelectorAll(".seg-b").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".seg-b").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("[data-pane]").forEach(p=>p.hidden=p.dataset.pane!==tab);
  loaders[tab]();
}));
function show(){ const on=!!GP.db.session(); login.hidden=on; panel.hidden=!on; if(on) load(); }
login.addEventListener("submit",async e=>{
  e.preventDefault(); lerr.textContent="";
  const d=new FormData(login);
  try{ await GP.db.signIn(d.get("email"),d.get("password")); show(); }
  catch(x){ lerr.textContent = x.message.includes("not confirmed") ? "邮箱还没确认，去邮箱点一下确认链接。" : "邮箱或密码不对。"; }
});
document.getElementById("reg").addEventListener("click",async()=>{
  lerr.textContent="";
  const d=new FormData(login);
  if(!login.reportValidity()) return;
  try{ await GP.db.signUp(d.get("email"),d.get("password")); lerr.textContent="注册好了，去邮箱点确认链接，再回来登录。"; }
  catch(x){ lerr.textContent="注册没成功："+x.message; }
});
document.getElementById("out").addEventListener("click",()=>{ GP.db.signOut(); show(); });
document.getElementById("refresh").addEventListener("click",()=>loaders[tab]());
show();
</script>
</body>
</html>
