<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GoPro 流浪计划社区：流浪者在这里分享，大家一起评论。">
<title>社区</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
</head>
<body data-page="community">
<main class="wrap">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">社区</div>
    <h1 id="h1">流浪者来讲</h1>
    <p class="lede">只有流浪者能发帖，大家都可以在下面评论、提问、接龙。</p>
  </header>
  <div id="feed" class="stack"><div class="empty">加载中…</div></div>
</main>
<script src="assets/common.js"></script>
<script src="assets/db.js"></script>
<script>
const feed=document.getElementById("feed");
const only=parseInt(new URLSearchParams(location.search).get("n"),10)||null;
const el=(tag,cls,text)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const when=t=>new Date(t).toLocaleString("zh-CN",{timeZone:"Europe/London",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
let me=null, myName="", banned=false, mine=new Set(); // 登录的人才能评论；mine 是自己发的帖子

if(only && GP.shown[only-1]){
  const s=GP.shown[only-1];
  document.getElementById("eyebrow").textContent=`社区 · 第 ${only} 站`;
  document.getElementById("h1").textContent=`${GP.ZH[s.city]}这一周`;
}

function cmtNode(c){
  const d=el("div","cmt");
  if(c.avatar_url){ const im=el("img","cmt-av"); im.src=c.avatar_url; im.alt=""; im.referrerPolicy="no-referrer"; d.append(im); }
  d.append(el("b",null,c.nickname), document.createTextNode(c.body), el("span","muted",when(c.created_at)));
  return d;
}
function postCard(p, cmts){
  const host=p.stop_no===0; // 站号 0 是发起人
  const s=host?{xhs:"发起人 "+GP.host.name,avatar:GP.host.avatar}:(GP.stops[p.stop_no-1]||{});
  const card=el("article","card post");
  const head=el("div","post-head");
  if(s.avatar){ const im=el("img"); im.src=GP.avatarSrc(s.avatar); im.alt=`${s.xhs}的头像`; head.append(im); }
  else head.append(el("div","ph-av",(s.xhs||"?").slice(0,1)));
  const who=el("div"); who.append(el("b",null,s.xhs||"持有人"));
  const meta=el("a","muted",host?when(p.created_at):`第 ${p.stop_no} 站 · ${GP.ZH[s.city]||""} · ${when(p.created_at)}`); meta.href=host?"about.html":`stop.html?n=${p.stop_no}`; meta.style.textDecoration="none";
  who.append(meta); head.append(who);
  if(mine.has(p.id)){
    const del=el("button","link-btn","删除"); del.type="button"; del.style.marginLeft="auto"; del.setAttribute("aria-label","删除我的这条帖子");
    del.onclick=async()=>{
      if(!confirm("删除这条帖子？删除后大家就看不到了。")) return;
      del.disabled=true;
      try{ if(await GP.db.deleteMyPost(p.id)) card.remove(); else { del.disabled=false; alert("没删掉，刷新页面再试"); } }
      catch(x){ del.disabled=false; alert(x.status===401?"登录过期了，刷新页面重新登录":"没删掉，稍后再试"); }
    };
    head.append(del);
  }
  card.append(head);
  card.append(el("p","post-body",p.body));
  if(p.images && p.images.length){
    const g=el("div","pics"+(p.images.length===1?" one":p.images.length===2||p.images.length===4?" two":""));
    p.images.forEach(u=>{ const a=el("a"); a.href=u; a.target="_blank"; a.rel="noopener"; const im=el("img"); im.src=u; im.loading="lazy"; im.alt="照片"; a.append(im); g.append(a); });
    card.append(g);
  }
  const box=el("div","cmts");
  const list=el("div","stack"); list.style.gap="6px";
  cmts.forEach(c=>list.append(cmtNode(c)));
  let f;
  if(!me){
    f=el("div","signin-card"); f.append(el("span","muted","登录后才能评论"));
    const a=el("a","btn hot","登录 / 注册"); a.href="login.html?next=community.html"; f.append(a);
  }else{
    f=el("form","cform"); f.noValidate=true;
    f.innerHTML=`<input name="body" maxlength="500" placeholder="说点什么" aria-label="评论">
      <div class="row" style="justify-content:space-between;align-items:center"><span class="muted who-line" style="font-size:13px"></span><span class="err" role="alert" style="margin:0"></span><button class="btn hot" type="submit" style="margin-left:auto">评论</button></div>`;
    f.querySelector(".who-line").textContent=`以「${myName}」评论`;
    const err=f.querySelector(".err"), btn=f.querySelector("button");
    if(banned){ f.elements.body.disabled=true; btn.disabled=true; err.textContent="这个账号暂时不能评论"; }
    f.addEventListener("submit",async e=>{
      e.preventDefault(); err.textContent="";
      const body=f.elements.body.value.trim();
      if(!body){ err.textContent="写点内容"; f.elements.body.focus(); return; }
      btn.disabled=true;
      try{
        const c=await GP.db.addComment({post_id:p.id,body});
        list.append(cmtNode(c||{nickname:myName,body,created_at:new Date().toISOString()}));
        f.elements.body.value="";
      }catch(x){
        err.textContent = x.status===401 ? "登录过期了，刷新页面重新登录" : /频繁/.test(x.message) ? "评论太频繁，稍后再试" : /不能评论/.test(x.message) ? "这个账号暂时不能评论" : "没发出去，稍后再试";
      }
      btn.disabled=false;
    });
  }
  box.append(list,f); card.append(box);
  return card;
}

(async()=>{
  try{
    const u=await GP.db.user();
    if(u){ let prof=null; try{ prof=await GP.db.profile(u.id); }catch(e){} me=u; myName=GP.db.nameOf(u,prof); banned=!!(prof&&prof.banned); mine=new Set(await GP.db.myPostIds()); }
    // 只显示已经开始的站，不提前暴露后面的站
    const posts=(await GP.db.posts(GP.season, only)).filter(p=>p.stop_no<=GP.shown.length);
    const cmts=await GP.db.comments(posts.map(p=>p.id));
    if(!posts.length){
      feed.replaceChildren(el("div","empty","还没有帖子。流浪者发了之后会出现在这里。"));
    }else{
      feed.replaceChildren(...posts.map(p=>postCard(p,cmts.filter(c=>c.post_id===p.id))));
    }
    if(only){ const a=el("a","btn","看全部帖子"); a.href="community.html"; const r=el("div","row"); r.append(a); feed.append(r); }
  }catch(e){
    feed.replaceChildren(el("div","empty","社区暂时打不开，稍后再试。"));
  }
})();
</script>
</body>
</html>
