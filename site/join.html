<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GoPro 流浪计划：一台相机，一人一周，在英国留学生之间传递。">
<title>报名下一期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
</head>
<body data-page="join">
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">报名</div>
    <h1>想接相机？</h1>
    <p class="lede" id="lede"></p>
  </header>
  <section class="card">
    <h2 style="margin-top:0">现在怎么报名</h2>
    <ol class="steps">
      <li>在小红书搜 <b>#GoPro流浪计划</b>，找到招募帖。</li>
      <li>在评论区留言「第二期 + 你的城市」。</li>
      <li>或者直接私信发起人 <b>奶盖</b>，我拉你进群。</li>
    </ol>
  </section>
  <section class="card">
    <h2 style="margin-top:0">需要准备什么</h2>
    <ol class="steps">
      <li>人在英国，有一周时间能带着相机。</li>
      <li>交接时简单登记一下，方便联系。</li>
      <li>不需要会拍、会剪，想拍什么拍什么。</li>
    </ol>
  </section>
  <div class="empty">网页报名表正在做，上线后在这里直接填。</div>
</main>
<script src="assets/common.js"></script>
<script>
document.getElementById("lede").textContent=`下一期 ${GP.join.opens} 开始招募。名额有限，按报名先后和城市安排。`;
</script>
</body>
</html>
