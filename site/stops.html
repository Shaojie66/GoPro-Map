<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GoPro 流浪计划：一台相机，一人一周，在英国留学生之间传递。">
<title>每一站</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
</head>
<body data-page="stops">
<main class="wrap">
  <header class="hero">
    <div class="eyebrow" id="season"></div>
    <h1>每一站</h1>
    <p class="lede">每个人拿相机一周，拍什么都行。点进去看这一站的作品。</p>
  </header>
  <div id="list"></div>
</main>
<script src="assets/common.js"></script>
<script>
document.getElementById("season").textContent=`${GP.season} · 已经走过 ${GP.shown.length} 站`;
document.getElementById("list").append(GP.shown.length?GP.stopList():Object.assign(document.createElement("div"),{className:"empty",textContent:"相机还没出发。"}));
</script>
</body>
</html>
